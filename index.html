<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Han</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="title">Hanna's Personal Room</h1>

    <div class="scene" id="scene">
      <div class="table"></div>
      <img
        src="images/loveletter.png"
        class="letter"
        id="letter"
        alt="letter"
      />
      <div
        class="cat cat-7"
        id="cat1"
        data-type="happy"
        style="top: 78%; left: 40%"
      ></div>
      <div
        class="cat cat-7"
        id="cat3"
        data-type="happy"
        style="top: 20%; left: 8%"
      ></div>
      <div
        class="cat cat-7 flippy"
        id="cat4"
        data-type="happy"
        style="top: 15%; left: 80%"
      ></div>
      <div
        class="cat cat-10"
        id="cat5"
        data-type="comfort"
        style="top: 60%; left: 12%"
      ></div>
      <div
        class="cat cat-sleep"
        id="cat7"
        data-type="rest"
        style="top: 50%; left: 80%"
      ></div>
      <div
        class="cat cat-sleep flip"
        id="cat8"
        data-type="rest"
        style="top: 10%; left: 35%"
      ></div>
      <div
        class="cat cat-sit"
        id="cat9"
        data-type="comfort"
        style="top: 73%; left: 66%"
      ></div>
    </div>
    <div id="messageBox" class="message-box hidden">
      <p id="messageText"></p>
      <button id="closeBtn">Close</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
